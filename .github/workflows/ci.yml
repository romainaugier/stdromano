name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ROMANO_FUZZ_SCALE: ${{ github.event_name == 'schedule' && '20' || '1' }}

jobs:
  linux:
    name: Linux ${{ matrix.arch }} (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-24.04, name: release + opencl, flags: "--opencl" }
          - { arch: x64, runner: ubuntu-24.04, name: asan + lsan, flags: "--reldebug --addrsan --leaksan" }
          - { arch: x64, runner: ubuntu-24.04, name: ubsan, flags: "--reldebug --ubsan" }
          - { arch: x64, runner: ubuntu-24.04, name: tsan, flags: "--reldebug --threadsan" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, name: release, flags: "" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, name: asan + lsan, flags: "--reldebug --addrsan --leaksan" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, name: ubsan, flags: "--reldebug --ubsan" }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing libgtk2.0-dev ocl-icd-opencl-dev pocl-opencl-icd autoconf autoconf-archive automake libtool
          if [[ "${{ matrix.arch }}" == "x64" ]]; then sudo apt-get install -y nasm; fi

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-linux-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'build.sh', 'cmake/triplets/*') }}
          restore-keys: vcpkg-linux-${{ matrix.arch }}-

      - name: Build and test
        run: ./build.sh --tests ${{ matrix.flags }}

      - name: Test log
        if: failure()
        run: cat build/Testing/Temporary/LastTest.log || true

  windows:
    name: Windows ${{ matrix.arch }} (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2022, name: release, flags: "" }
          - { arch: x64, runner: windows-2022, name: asan, flags: "--reldebug --addrsan" }
          - { arch: ARM64, runner: windows-11-arm, name: release, flags: "" }
          - { arch: ARM64, runner: windows-11-arm, name: reldebug, flags: "--reldebug" }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-windows-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'build.bat', 'cmake/triplets/*') }}
          restore-keys: vcpkg-windows-${{ matrix.arch }}-

      - name: Build and test
        shell: cmd
        run: build.bat --tests --arch:${{ matrix.arch }} ${{ matrix.flags }}

      - name: Test log
        if: failure()
        shell: cmd
        run: type build\Testing\Temporary\LastTest.log

  macos:
    name: macOS arm64 (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: release, flags: "" }
          - { name: asan, flags: "--reldebug" }

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: lukka/get-cmake@latest

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-macos-arm64-${{ hashFiles('vcpkg.json', 'build.sh', 'cmake/triplets/*') }}
          restore-keys: vcpkg-macos-arm64-

      - name: Build and test
        run: ./build.sh --tests ${{ matrix.flags }}

      - name: Test log
        if: failure()
        run: cat build/Testing/Temporary/LastTest.log || true
